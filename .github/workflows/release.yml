name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      PIX_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      PIX_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # An unset secret expands to an empty identity, which makes codesign fail.
      # Use Tauri's ad-hoc identity when no Apple identity is configured.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare bundled Node and tool runtimes
        run: pnpm --filter @pix/desktop exec node scripts/prepare-sidecar.mjs --release
      - name: Verify release version
        if: github.ref_type == 'tag'
        run: node scripts/release-assets.mjs check-version "${{ github.ref_name }}"
      - name: Verify shared Node tools and native dependencies
        run: pnpm --filter @pix/desktop test:shared-node
      - name: Verify packaged Sidecar and TypeScript extensions
        run: pnpm --filter @pix/desktop exec node scripts/sidecar-smoke.test.mjs --staged
      - name: Build installers
        shell: bash
        run: |
          if [[ -n "$PIX_UPDATER_PUBLIC_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            pnpm --filter @pix/desktop exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [[ -n "$PIX_UPDATER_PUBLIC_KEY" || -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Both updater signing public and private keys must be configured" >&2
            exit 1
          else
            pnpm --filter @pix/desktop exec tauri build
          fi
      - name: Test Windows Sidecar launch paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIX_SMOKE_NODE = (Resolve-Path 'apps/desktop/src-tauri/binaries/node.exe').Path
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml sidecar::tests
      - name: Collect Tauri assets
        run: node scripts/release-assets.mjs collect apps/desktop/src-tauri/target/release/bundle artifacts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pix-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pix-*
          merge-multiple: true
      - name: Validate artifacts and create signed updater manifest
        run: node scripts/release-assets.mjs manifest release-assets "${{ github.repository }}" "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
