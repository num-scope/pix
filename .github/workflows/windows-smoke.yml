name: Windows installed app smoke
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Release workflow run containing the Windows installer to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download released Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: gh run download $env:RELEASE_RUN_ID --repo $env:GITHUB_REPOSITORY --name pix-x86_64-pc-windows-msvc --dir installer
      - name: Install and exercise the bundled Sidecar
        shell: pwsh
        run: |
          Get-ChildItem installer -File | Select-Object Name, Length | Format-Table -AutoSize
          $installer = Get-ChildItem installer -Filter '*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows NSIS installer missing from release' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Pix 安装 Smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $env:PIX_SMOKE_NODE = Join-Path $installDir 'node.exe'
          $env:PIX_SMOKE_ROOT = Join-Path $installDir 'sidecar'
          $env:PIX_RESOURCES_DIR = $installDir
          $env:PIX_PACKAGED = '1'
          $env:PIX_SIDECAR_DEBUG = '1'
          if (!(Test-Path $env:PIX_SMOKE_NODE)) { throw 'Bundled Node executable missing after installation' }
          $nodes = @(Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter node.exe)
          if ($nodes.Count -ne 1 -or $nodes[0].FullName -ne $env:PIX_SMOKE_NODE) {
            throw 'Expected exactly one shared Node executable in the installed app'
          }
          node apps/desktop/scripts/sidecar-smoke.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Sidecar smoke test failed' }
          node apps/desktop/scripts/shared-node-smoke.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed shared Node compatibility test failed' }
      - name: Exercise the installed Tauri window and model settings
        shell: pwsh
        run: |
          $env:PIX_NATIVE_EXECUTABLE = Join-Path $env:RUNNER_TEMP 'Pix 安装 Smoke/pix-desktop.exe'
          # Hosted Windows runners are elevated; current WebView2 ignores env
          # debugger overrides there. Scope the policy to this app on this VM.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          $overrides = @{
            AdditionalBrowserArguments = '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1'
            UserDataFolder = (Join-Path $env:RUNNER_TEMP 'pix-smoke-webview')
          }
          try {
            foreach ($key in $overrides.Keys) {
              New-Item -Path "$policy\$key" -Force | Out-Null
              New-ItemProperty -Path "$policy\$key" -Name 'pix-desktop.exe' -Value $overrides[$key] -PropertyType String -Force | Out-Null
            }
            node apps/desktop/scripts/windows-native-smoke.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Installed native window smoke test failed' }
          } finally {
            foreach ($key in $overrides.Keys) {
              Remove-ItemProperty -Path "$policy\$key" -Name 'pix-desktop.exe' -ErrorAction SilentlyContinue
            }
          }
